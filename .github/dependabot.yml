# .github/dependabot.yml: automated dependency updates.
#
# Two ecosystems. `github-actions` bumps the SHA-pinned actions the workflows
# in this directory use, and `cargo` the crate's dependencies.
#
# COOLDOWN is the delay between a release being published and this bot
# proposing it, so a compromised or yanked release has a window to be caught
# before it reaches a pull request (the OWASP CI/CD Security Cheat Sheet's
# third-party-code control). Every entry sits at 7 days or more, the floor
# zizmor's `dependabot-cooldown` audit enforces, and the audit runs over this
# file in CI.
#
# SECURITY updates are exempt by design: Dependabot applies no cooldown to
# advisory-driven bumps, so an advisory still arrives immediately.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "github-actions"
    # The root covers .github/workflows/; the composite actions under
    # .github/actions/ pin actions of their own and are listed explicitly, so a
    # bump never lands in a workflow while the composite keeps the old pin.
    directories:
      - "/"
      - "/.github/actions/*"
    labels:
      - "dependencies"
    schedule:
      interval: "weekly"
    # `semver-major-days` is not accepted for this ecosystem, so `default-days`
    # covers every bump.
    cooldown:
      default-days: 7
    groups:
      # ONE weekly PR for every minor and patch action bump. MAJORS stay
      # individual: a breaking action major is a real review.
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "cargo"
    directory: "/"
    labels:
      - "dependencies"
    schedule:
      interval: "weekly"
    # Longer for a major than for an action: a compromised crate executes in
    # the build and ships in the binary, which is the higher-consequence case.
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    groups:
      # ONE weekly PR for every minor and patch bump. MAJORS stay individual:
      # a semver major in shipped code is a real review.
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
