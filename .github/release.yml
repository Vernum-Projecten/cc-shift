# Configuration for GitHub's auto-generated release notes. Every category maps
# onto a label the tracker already uses (bootstrapped by scripts/gh/labels.sh);
# no label is invented here. A feature or a fix carries no label, because the
# native issue type says which it is, and release notes cannot group by an
# issue type, so those pull requests land under "Other changes".
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  categories:
    - title: Security
      labels:
        - security
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Maintenance
      labels:
        - chore
        - refactor
        - perf
        - test
        - ci
    - title: Other changes
      labels:
        - "*"
