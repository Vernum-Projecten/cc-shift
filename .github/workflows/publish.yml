# publish.yml: publishes cc-shift to crates.io from a release tag (the Cargo
# reference, Publishing on crates.io; no specification governs the policy:
# our own design, carried from the owner's other Rust projects).
#
# It runs on every `v*` tag, and on a manual dispatch as a dry run or, with
# `publish`, the recovery path. While Cargo.toml says `publish = false`, the
# publish job is skipped and the run is a successful no-op that says so.
#
# Authentication is crates.io Trusted Publishing (OIDC): the
# rust-lang/crates-io-auth-action step exchanges this workflow's identity for
# a short-lived token, so no crates.io token is stored in the repository. The
# crate's Trusted Publisher entry names this file, the
# Vernum-Projecten/cc-shift repository and the `crates-io` environment.
#
# Both jobs run on macOS: cc-shift builds on macOS only, and cargo builds the
# package before it uploads.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Really publish to crates.io (false = dry run)"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  package:
    name: package
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      publishable: ${{ steps.switch.outputs.publishable }}
      version: ${{ steps.switch.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache in a publishing lane: the packaging below checks the same
      # bytes a real publish uploads.
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - id: switch
        name: Read the version and the publish switch
        run: |
          set -euo pipefail
          meta="$(cargo metadata --no-deps --format-version 1)"
          version="$(jq -r '.packages[0].version' <<< "$meta")"
          publishable="$(jq -r 'if .packages[0].publish == [] then "false" else "true" end' <<< "$meta")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishable=$publishable" >> "$GITHUB_OUTPUT"
          if [ "$publishable" = "true" ]; then
            echo "### cc-shift $version is publishable" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Nothing to publish"
              echo
              echo "Cargo.toml says \`publish = false\`, so this run is a successful no-op."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # A tag that disagrees with the version in Cargo.toml publishes nothing.
      - name: The tag names the crate version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.switch.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not name the crate version $VERSION, so nothing is published."
            exit 1
          fi
          echo "tag $TAG names the crate version $VERSION"
      - name: Package and build the crate (no upload)
        run: cargo package --locked --allow-dirty

  publish:
    name: publish
    needs: package
    # A tag publishes; a dispatch publishes only when asked to, and only from
    # a release tag, the one ref the crates-io environment accepts.
    if: >-
      needs.package.outputs.publishable == 'true' && (github.event_name == 'push' ||
      (inputs.publish && startsWith(github.ref, 'refs/tags/v')))
    runs-on: macos-latest
    timeout-minutes: 30
    # The environment is part of the crate's Trusted Publisher entry on
    # crates.io.
    environment: crates-io
    # Two runs uploading the same immutable version never interleave. Queue,
    # never cancel.
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token exchange (rust-lang/crates-io-auth-action)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - id: auth
        name: Exchange the OIDC identity for a temporary crates.io token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
      # The registry is the ground truth, so the read-back runs even when the
      # upload step went red.
      - name: Verify the version resolves on crates.io
        if: always()
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'cc-shift publish workflow' "https://crates.io/api/v1/crates/cc-shift/$VERSION")"
            if [ "$status" = "200" ]; then
              echo "cc-shift $VERSION is on crates.io"
              exit 0
            fi
            echo "attempt $attempt: crates.io answered $status, waiting"
            sleep 10
          done
          echo "::error::cc-shift $VERSION did not resolve on crates.io"
          exit 1
