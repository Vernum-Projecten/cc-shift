# The release lane. One workflow owns the `v*` tag, and every ordering in it is
# a `needs` edge:
#
#   plan ── github-release (draft) ─┬─ build (aarch64, x86_64) ─┬─ finalize-release (publish)
#                                   └─ crates-io ───────────────┘
#
# The GitHub release is created as a DRAFT, the binaries with their SHA-256
# files are attached to it, the crate goes to crates.io, and only once every
# expected asset is attached is the release PUBLISHED, so a half-assembled
# release is never visible. Carried from the owner's FerroFED release lane and
# cut down to one macOS-only crate (no specification governs the policy: our
# own design).
#
# crates.io is reached through Trusted Publishing (OIDC): the
# rust-lang/crates-io-auth-action step exchanges this workflow's identity for a
# short-lived token, so no crates.io token is stored in the repository. The
# crate's Trusted Publisher entry names this file, the
# Vernum-Projecten/cc-shift repository and the `crates-io` environment.
#
# Every job that compiles runs on macOS, because cc-shift builds on macOS only.
# No job restores a cache: a cache an untrusted run could poison must never
# feed a release.
#
# The workflow is dormant until a `v*` tag is pushed. It does not run on a push
# to main or on a pull request.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)publish. Dispatch this workflow AT that tag."
        required: true
        type: string

# A release must never be cancelled part-way through publishing: a second run
# queues behind the first rather than replacing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    name: plan
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.facts.outputs.tag }}
      version: ${{ steps.facts.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      # The tag, the version, the publish switch and the changelog entry must
      # agree before anything is created.
      - id: facts
        name: Check the release facts
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            if [ "$REF_NAME" != "$tag" ]; then
              echo "::error::dispatch this workflow at the tag $tag, not at $REF_NAME." >&2
              exit 1
            fi
          else
            tag="$REF_NAME"
          fi
          meta="$(cargo metadata --no-deps --locked --format-version 1)"
          version="$(jq -r '.packages[0].version' <<< "$meta")"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not name the crate version $version." >&2
            exit 1
          fi
          if [ "$(jq -r '.packages[0].publish == []' <<< "$meta")" = "true" ]; then
            echo "::error::Cargo.toml says publish = false, so $tag is not released." >&2
            exit 1
          fi
          if ! grep -Eq "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no ## [$version] section." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### cc-shift $version from $tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.facts.outputs.version }}
        run: |
          set -euo pipefail
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]*\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::the ## [$VERSION] section of CHANGELOG.md is empty." >&2
            exit 1
          fi
      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  github-release:
    name: github release (draft)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      # Created as a DRAFT and published only after every asset is attached.
      # A draft is not visible to anyone browsing releases.
      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"
          case "$state" in
            missing)
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
                --title "$VERSION" --notes-file release-notes.md
              echo "created the draft release $TAG"
              ;;
            true)
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
              echo "the draft release $TAG exists; its notes are refreshed"
              ;;
            *)
              echo "::error::the release $TAG is already published; nothing is changed." >&2
              exit 1
              ;;
          esac

  build:
    name: binary (${{ matrix.target }})
    needs: [plan, github-release]
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    permissions:
      contents: write # attach the binary to the draft release
      id-token: write # Sigstore, for the provenance attestation
      attestations: write # store it against this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Add the target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - id: package
        name: Package the binary with its README and licence
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          name="cc-shift-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/cc-shift" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - name: Attach the archive to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  crates-io:
    name: crates.io
    needs: [plan, github-release]
    runs-on: macos-latest
    timeout-minutes: 30
    # The environment is part of the crate's Trusted Publisher entry on
    # crates.io, and only accepts `v*` tags.
    environment: crates-io
    permissions:
      contents: read
      id-token: write # OIDC token exchange (rust-lang/crates-io-auth-action)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      # A version on crates.io is immutable, so one that is already there (a
      # first version published by hand, or a re-run) is skipped.
      - id: present
        name: Check whether the version is already on crates.io
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'cc-shift release workflow' "https://crates.io/api/v1/crates/cc-shift/$VERSION")"
          if [ "$status" = "200" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "### cc-shift $VERSION is already on crates.io; nothing is uploaded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - id: auth
        name: Exchange the OIDC identity for a temporary crates.io token
        if: steps.present.outputs.present == 'false'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        if: steps.present.outputs.present == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
      # The registry is the ground truth, so the read-back runs even when the
      # upload step went red.
      - name: Verify the version resolves on crates.io
        if: always()
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'cc-shift release workflow' "https://crates.io/api/v1/crates/cc-shift/$VERSION")"
            if [ "$status" = "200" ]; then
              echo "cc-shift $VERSION is on crates.io"
              exit 0
            fi
            echo "attempt $attempt: crates.io answered $status, waiting"
            sleep 10
          done
          echo "::error::cc-shift $VERSION did not resolve on crates.io" >&2
          exit 1

  finalize-release:
    name: github release (publish)
    # Every `needs` job has to succeed, so a failed or skipped leg leaves the
    # release a draft.
    needs: [plan, github-release, build, crates-io]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # publish the release
    steps:
      - name: The draft carries every asset this version promises
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "attached assets:"
          printf '%s\n' "$assets"
          missing=""
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            for suffix in ".tar.gz" ".tar.gz.sha256"; do
              printf '%s\n' "$assets" | grep -Fxq "cc-shift-${TAG}-${target}${suffix}" \
                || missing="$missing cc-shift-${TAG}-${target}${suffix}"
            done
          done
          if [ -n "$missing" ]; then
            echo "::error::the draft is missing assets, so it is not published:$missing" >&2
            exit 1
          fi
          echo "every expected asset is attached."
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
