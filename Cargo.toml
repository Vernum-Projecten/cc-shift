[package]
name = "cc-shift"
version = "0.0.9"
edition = "2024"
rust-version = "1.98"
description = "Switches Claude Code between several Claude accounts on macOS on its own, before a usage limit is hit."
license = "Apache-2.0"
repository = "https://github.com/Vernum-Projecten/cc-shift"
homepage = "https://github.com/Vernum-Projecten/cc-shift"
readme = "README.md"
keywords = ["claude-code", "claude", "macos", "usage-limits", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]
publish = true

# docs.rs builds on Linux; cc-shift builds on macOS only, so its docs are
# built for the two macOS targets.
[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[dependencies]
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "unwind"
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
dead_code = "deny"
let_underscore_drop = "deny"
non_local_definitions = "deny"
unexpected_cfgs = "deny"
unsafe_op_in_unsafe_fn = "deny"
ffi_unwind_calls = "deny"
deprecated_safe_2024 = "deny"
ambiguous_negative_literals = "deny"
unused_must_use = "deny"
macro_use_extern_crate = "warn"
absolute_paths_not_starting_with_crate = "warn"
unit_bindings = "warn"
meta_variable_misuse = "warn"
explicit_outlives_requirements = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "warn"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
panic_in_result_fn = "deny"
missing_assert_message = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
as_underscore = "deny"
fn_to_numeric_cast_any = "deny"
precedence_bits = "deny"
suspicious_xor_used_as_pow = "deny"
integer_division = "warn"
unchecked_time_subtraction = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
unused_result_ok = "deny"
map_err_ignore = "warn"
iter_over_hash_type = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
allow_attributes_without_reason = "deny"
allow_attributes = "warn"
too_long_first_doc_paragraph = "warn"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
derivable_impls = "deny"
pub_use = "deny"
incompatible_msrv = "deny"
verbose_file_reads = "deny"
filetype_is_file = "deny"
create_dir = "deny"
large_include_file = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
mem_forget = "deny"
pointer_format = "deny"
empty_drop = "warn"
deref_by_slicing = "warn"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
