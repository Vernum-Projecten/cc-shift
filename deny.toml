# cargo-deny configuration. Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# This is the ONLY advisory gate. cargo deny check advisories reads the same
# RustSec database cargo audit does and adds yanked, licenses, bans and
# sources, so there is no separate cargo-audit job.

[graph]
all-features = true

[advisories]
version = 2
# Fail on any RustSec advisory. Add exceptions explicitly, dated, and each
# naming the event that deletes it.
yanked = "deny"
ignore = []

[licenses]
version = 2
# Dev-dependencies are compiled here and in CI, so the check covers them
# (https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html).
include-dev = true
# Permissive licences an Apache-2.0 project can depend on. Copyleft is not
# allowed by default; a weak-copyleft dependency gets a crate-scoped
# exceptions entry with its reason.
#
# A licence joins the list the day a dependency needs it, with the reason it
# is acceptable here, and leaves when the last crate carrying it does, so
# cargo deny reports no unencountered licence.
allow = [
  "MIT",
  "Apache-2.0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = []
# Each entry names a duplicate inherent to the pinned set, with its reason;
# the list starts empty and grows only from `cargo deny check bans` output.
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
